[project]
name = "rowsmyth"
dynamic = ["version"]
description = "Forged test data for SQLAlchemy models - no boilerplate required."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Laurence Rawlings", email = "contact@laurencerawlings.com" }]
requires-python = ">=3.12"
keywords = ["sqlalchemy", "testing", "factory-boy", "test-data", "fixtures"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "factory-boy>=3.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
spark = ["pyspark>=3.0"]

[project.urls]
Homepage = "https://github.com/LaurenceRawlings/rowsmyth"
Repository = "https://github.com/LaurenceRawlings/rowsmyth"
Documentation = "https://laurencerawlings.github.io/rowsmyth"
Issues = "https://github.com/LaurenceRawlings/rowsmyth/issues"
Changelog = "https://github.com/LaurenceRawlings/rowsmyth/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "commitizen>=4.16.2",
    "hatch>=1.16.5",
    "hatch-vcs>=0.5.0",
    "portray>=1.8.0",
    "pre-commit>=4.6.0",
    "pyspark>=4.1.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
    "ty>=0.0.39",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/rowsmyth/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rowsmyth"]

[tool.hatch.build.targets.sdist]
include = [
    "src/rowsmyth",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "tests/",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "ANN",
    "RUF",
    "C90",
    "N",
    "PERF",
    "PTH",
    "TC",
    "PGH",
    "TRY",
    "EM",
]
ignore = [
    "ANN401",
    "TRY003",
]

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "N"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests"]
skips = ["B311"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "scm"
changelog_file = "CHANGELOG.md"
bump_message = "chore(release): bump version to $new_version"
update_changelog_on_bump = true

[tool.pytest.ini_options]
testpaths = ["tests", "src/rowsmyth"]
addopts = "--cov=rowsmyth --cov-report=term-missing --cov-fail-under=100 --doctest-modules --ignore=src/rowsmyth/_version.py"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.coverage.run]
source = ["src/rowsmyth"]
omit = ["src/rowsmyth/_version.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.typos.default]
locale = "en-gb"

[tool.typos.default.extend-words]
rowsmyth = "rowsmyth"
catalog = "catalog"

[tool.portray]
output_dir = "site"
extra_markdown_modules = ["CHANGELOG.md", "CONTRIBUTING.md"]

[tool.portray.mkdocs]
site_name = "rowsmyth"
site_description = "Forged test data for SQLAlchemy models - no boilerplate required."
repo_url = "https://github.com/LaurenceRawlings/rowsmyth"
