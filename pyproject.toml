[project]
name = "rowsmyth"
dynamic = ["version"]
description = "Declarative relational test data as Spark DataFrames with referential integrity"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Laurence Rawlings", email = "contact@laurencerawlings.com" },
]
requires-python = ">=3.12"
keywords = ["testing", "test-data", "fixtures", "databricks", "spark"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = [
  "faker>=40.20.0",
  "pyspark>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/LaurenceRawlings/rowsmyth"
Repository = "https://github.com/LaurenceRawlings/rowsmyth"
Documentation = "https://laurencerawlings.github.io/rowsmyth"
Issues = "https://github.com/LaurenceRawlings/rowsmyth/issues"
Changelog = "https://github.com/LaurenceRawlings/rowsmyth/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "chispa>=0.12.0",
  "bandit[toml]>=1.9.4",
  "commitizen>=4.16.3",
  "portray>=1.8.0",
  "pre-commit>=4.6.0",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.15",
  "ty>=0.0.42",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/rowsmyth/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rowsmyth"]

[tool.hatch.build.targets.sdist]
include = [
  "src/rowsmyth",
  "README.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "LICENSE",
  "docs/",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "ANN",
  "RUF",
  "C90",
  "N",
  "PERF",
  "PTH",
  "TC",
  "PGH",
  "TRY",
  "EM",
]
ignore = ["ANN401", "N812", "TRY003"]

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "N", "TC002", "SIM117"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["rowsmyth"]

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests"]
skips = ["B311"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "scm"
changelog_file = "CHANGELOG.md"
bump_message = "chore(release): bump version to $new_version"
update_changelog_on_bump = true

[tool.pytest.ini_options]
testpaths = ["tests", "src/rowsmyth"]
pythonpath = ["."]
addopts = "--cov=rowsmyth --cov-report=term-missing --cov-fail-under=100 --doctest-modules --ignore=src/rowsmyth/_version.py"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.coverage.run]
source = ["src/rowsmyth"]
omit = ["src/rowsmyth/_version.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ty]
[tool.ty.src]
include = ["src"]

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
possibly-unresolved-reference = "warn"

[tool.ty.terminal]
error-on-warning = true

[tool.typos.default]
locale = "en-gb"

[tool.typos.default.extend-words]
rowsmyth = "rowsmyth"
catalog = "catalog"

[tool.portray]
output_dir = "site"
extra_markdown_modules = [
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "docs/design.md",
  "docs/usage.md",
]

[tool.portray.mkdocs]
site_name = "rowsmyth"
site_description = "Declarative relational test data as Spark DataFrames with referential integrity"
site_url = "https://laurencerawlings.github.io/rowsmyth/"
repo_url = "https://github.com/LaurenceRawlings/rowsmyth"
repo_name = "LaurenceRawlings/rowsmyth"
edit_uri = "edit/main/"
